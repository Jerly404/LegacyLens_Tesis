<div class="space-y-6 max-w-7xl mx-auto">
  <!-- Header Banner -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-white/[0.08]">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-3xl font-extrabold tracking-tight text-white">Reverse-Engineered Architecture & UML</h1>
        <span class="px-2.5 py-0.5 rounded-full bg-blue-500/20 border border-blue-500/30 text-blue-400 text-xs font-mono font-bold">
          {{ projectService.selectedProject().name }}
        </span>
      </div>
      <p class="text-xs text-slate-400 mt-1">
        Interactive system architecture, database ERD, C4 container model, and class hierarchies extracted from source code.
      </p>
    </div>

    <div class="flex items-center gap-3">
      <button 
        (click)="regenerate()" 
        [disabled]="isRegenerating()"
        class="px-4 py-2 bg-purple-600/15 hover:bg-purple-600/25 text-purple-300 border border-purple-500/30 text-xs font-semibold rounded-xl transition flex items-center gap-1.5 disabled:opacity-50"
      >
        <span class="material-symbols-outlined text-base" [class.animate-spin]="isRegenerating()">auto_fix_high</span>
        {{ isRegenerating() ? 'Regenerating...' : 'Regenerate Diagram' }}
      </button>
    </div>
  </div>

  <!-- Tabs Selector (8 Complete Diagram Types) -->
  <div class="flex items-center gap-2 overflow-x-auto bg-[#151821] p-1.5 rounded-2xl border border-white/[0.08] text-xs font-medium scrollbar-thin">
    @for (tab of tabs; track tab.type) {
      <button 
        (click)="loadDiagram(tab.type)"
        [class]="activeType() === tab.type ? 'bg-blue-600 text-white shadow-sm shadow-blue-600/30 font-bold' : 'text-slate-400 hover:text-white hover:bg-white/[0.03]'"
        class="px-3.5 py-2 rounded-xl transition flex items-center gap-2 shrink-0"
      >
        <span class="material-symbols-outlined text-base">{{ tab.icon }}</span>
        <span>{{ tab.label }}</span>
      </button>
    }
  </div>

  <!-- Diagram Viewer Viewport -->
  @if (currentDiagram(); as diag) {
    <div class="h-[680px]">
      <app-diagram-viewer
        [definition]="diag.mermaidCode"
        [title]="diag.title"
      ></app-diagram-viewer>
    </div>
  }
</div>
