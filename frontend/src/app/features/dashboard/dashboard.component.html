<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Enterprise Overview</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Analyze legacy code repositories running local Large Language Models.</p>
    </div>
  </div>

  <!-- KPI Stats Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <app-card title="Total Projects" subtitle="Codebases currently indexed">
      <div class="flex justify-between items-center mt-2">
        <span class="text-3xl font-extrabold">12</span>
        <span class="material-icons text-brand-500 bg-brand-500/10 p-3 rounded-2xl">folder</span>
      </div>
    </app-card>
    <app-card title="Total Code Lines" subtitle="AST parser parsed lines">
      <div class="flex justify-between items-center mt-2">
        <span class="text-3xl font-extrabold">1.2M</span>
        <span class="material-icons text-emerald-500 bg-emerald-500/10 p-3 rounded-2xl">code</span>
      </div>
    </app-card>
    <app-card title="AI Queries" subtitle="Prompt completions from local LLM">
      <div class="flex justify-between items-center mt-2">
        <span class="text-3xl font-extrabold">34,102</span>
        <span class="material-icons text-purple-500 bg-purple-500/10 p-3 rounded-2xl">psychology</span>
      </div>
    </app-card>
    <app-card title="System Health" subtitle="Ollama, Qdrant, MinIO, Redis">
      <div class="flex justify-between items-center mt-2">
        <span class="text-3xl font-extrabold text-emerald-500">100%</span>
        <span class="material-icons text-emerald-500 bg-emerald-500/10 p-3 rounded-2xl">dns</span>
      </div>
    </app-card>
  </div>

  <!-- Visual Analytics & Charts -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <app-chart title="Engine Execution Speed (ms per file)"></app-chart>
    </div>
    <div>
      <app-diagram></app-diagram>
    </div>
  </div>
</div>
