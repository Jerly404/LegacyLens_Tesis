<form (submit)="login(); $event.preventDefault()" class="space-y-5">
  <div>
    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
    <div class="relative">
      <span class="material-icons absolute left-4 top-3 text-slate-500">mail</span>
      <input 
        type="email" 
        [(ngModel)]="email" 
        name="email"
        placeholder="developer@codelens.ai" 
        required
        class="w-full pl-12 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-white outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
      >
    </div>
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
    <div class="relative">
      <span class="material-icons absolute left-4 top-3 text-slate-500">lock</span>
      <input 
        type="password" 
        [(ngModel)]="password" 
        name="password"
        placeholder="••••••••" 
        required
        class="w-full pl-12 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-white outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
      >
    </div>
  </div>

  <app-button type="submit" [disabled]="loading()" class="w-full">
    {{ loading() ? 'Signing In...' : 'Sign In' }}
  </app-button>
</form>
