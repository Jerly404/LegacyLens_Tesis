version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codelens_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codelens_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codelens-network

  redis:
    image: redis:7-alpine
    container_name: codelens_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - codelens-network

  minio:
    image: minio/minio
    container_name: codelens_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - codelens-network

  qdrant:
    image: qdrant/qdrant
    container_name: codelens_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - codelens-network

  ollama:
    image: ollama/ollama
    container_name: codelens_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - codelens-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: codelens_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/codelens_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super-secret-jwt-key-change-in-production
      - JWT_EXPIRATION=24h
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=codelens-storage
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant
      - ollama
    networks:
      - codelens-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: codelens_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - codelens-network

volumes:
  pgdata:
  redisdata:
  miniodata:
  qdrantdata:
  ollamadata:

networks:
  codelens-network:
    driver: bridge
